<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Pond</title>
  <style>
    :root {
      --bg: #060606;
      --surface: #0e0e0e;
      --phosphor: #e8e8e2;
      --glow: #ffcc33;
      --dim: #333;
      --hint: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', 'Courier', monospace;
      color: var(--phosphor);
      user-select: none;
      overflow: hidden;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #title {
      font-size: 20px;
      letter-spacing: 0.35em;
      font-weight: 700;
      color: var(--glow);
      text-shadow: 0 0 14px var(--glow);
    }

    #scorebar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 480px;
      gap: 40px;
    }

    .score-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--hint);
      text-transform: uppercase;
    }

    .score-num {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--phosphor);
      text-shadow: 0 0 20px rgba(232,232,226,0.35);
    }

    .score-divider {
      width: 2px;
      height: 46px;
      background: #1e1e1e;
      flex-shrink: 0;
    }

    #stage {
      position: relative;
      background: var(--surface);
      box-shadow: 0 0 0 1px #1a1a1a;
    }

    #duck {
      display: block;
    }

    #msg {
      height: 22px;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 10px var(--glow);
      text-align: center;
      padding: 0 10px;
    }

    #controls {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hint);
      text-align: center;
    }

    .key {
      display: inline-block;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 16px;
      color: #555;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="title">DUCK POND</div>

  <div id="scorebar">
    <div class="score-side">
      <div class="score-label">Ducklings</div>
      <div class="score-num" id="score">0</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-side">
      <div class="score-label">Best</div>
      <div class="score-num" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="duck" width="480" height="480"></canvas>
  </div>

  <div id="msg">Press Space or Arrow Key to Start</div>

  <div id="controls">
    <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span>&nbsp; / &nbsp;<span class="key">WASD</span>&nbsp; Steer &nbsp;&nbsp;
    <span class="key">Space</span>&nbsp; Restart
  </div>
</div>

<script>
const canvas = document.getElementById('duck');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

const W = canvas.width, H = canvas.height;
const CELL = 24;
const COLS = W / CELL, ROWS = H / CELL;

const STATE = { WAIT: 0, PLAY: 1, OVER: 2 };
let state = STATE.WAIT;

let best = Number(localStorage.getItem('duckPondBest') || 0);
bestEl.textContent = best;

const DIRS = {
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
  left: { x: -1, y: 0 },
  right: { x: 1, y: 0 },
};

let train = [];
let dir = DIRS.right;
let nextDir = DIRS.right;
let bread = { x: 0, y: 0 };
let score = 0;
let frame = 0;
let moveInterval = 9;
let shake = 0;
let waterFrame = 0;

const lilyPads = [
  { x: 3, y: 3, r: 20, rot: 0.3 },
  { x: 16, y: 5, r: 16, rot: 1.1 },
  { x: 5, y: 15, r: 18, rot: 2.0 },
  { x: 15, y: 16, r: 22, rot: 0.7 },
];

function resetGame() {
  train = [
    { x: 6, y: 10 },
    { x: 5, y: 10 },
    { x: 4, y: 10 },
  ];
  dir = DIRS.right;
  nextDir = DIRS.right;
  score = 0;
  frame = 0;
  moveInterval = 9;
  scoreEl.textContent = 0;
  placeBread();
}

function placeBread() {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (train.some(s => s.x === cell.x && s.y === cell.y));
  bread = cell;
}

function setDir(d) {
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function startOrRestart() {
  if (state === STATE.WAIT) {
    state = STATE.PLAY;
    msgEl.textContent = '';
  } else if (state === STATE.OVER) {
    resetGame();
    state = STATE.WAIT;
    msgEl.textContent = 'Press Space or Arrow Key to Start';
  }
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
  };
  if (e.code in map) {
    e.preventDefault();
    if (state === STATE.WAIT) { startOrRestart(); }
    if (state === STATE.PLAY) setDir(DIRS[map[e.code]]);
  } else if (e.code === 'Space') {
    e.preventDefault();
    startOrRestart();
  }
});

function gameOver() {
  state = STATE.OVER;
  shake = 10;
  if (score > best) {
    best = score;
    localStorage.setItem('duckPondBest', String(best));
    bestEl.textContent = best;
  }
  msgEl.textContent = `Game Over — ${score} Ducklings — Press Space to Restart`;
}

function update() {
  waterFrame += 0.02;
  frame++;

  if (state !== STATE.PLAY) return;
  if (frame % moveInterval !== 0) return;

  dir = nextDir;
  const head = train[0];
  const nx = head.x + dir.x, ny = head.y + dir.y;

  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { gameOver(); return; }
  if (train.some(s => s.x === nx && s.y === ny)) { gameOver(); return; }

  train.unshift({ x: nx, y: ny });

  if (nx === bread.x && ny === bread.y) {
    score++;
    scoreEl.textContent = score;
    moveInterval = Math.max(4, 9 - Math.floor(score / 4));
    placeBread();
  } else {
    train.pop();
  }
}

function drawWater() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2f8fc4');
  grad.addColorStop(1, '#1b567f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, H);
    ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * CELL);
    ctx.lineTo(W, j * CELL);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const y = (i * 97 + waterFrame * 14) % (H + 40) - 20;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const yy = y + Math.sin(x * 0.04 + waterFrame * 2 + i) * 3;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}

function drawLilyPads() {
  for (const p of lilyPads) {
    const cx = p.x * CELL + CELL / 2, cy = p.y * CELL + CELL / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.rot);
    ctx.fillStyle = 'rgba(60,150,80,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0.35, Math.PI * 2 - 0.35);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawBread() {
  const cx = bread.x * CELL + CELL / 2, cy = bread.y * CELL + CELL / 2;
  const bob = Math.sin(waterFrame * 6) * 2;
  ctx.save();
  ctx.shadowColor = 'rgba(255,220,150,0.8)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#d99a4e';
  ctx.beginPath();
  ctx.ellipse(cx, cy + bob, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#c17f36';
  ctx.beginPath();
  ctx.arc(cx - 3, cy + bob - 1, 1.4, 0, Math.PI * 2);
  ctx.arc(cx + 3, cy + bob + 1, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawDuckling(cx, cy, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.ellipse(0, 0, CELL * 0.42, CELL * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(CELL * 0.32, -2);
  ctx.lineTo(CELL * 0.55, 0);
  ctx.lineTo(CELL * 0.32, 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(CELL * 0.18, -CELL * 0.14, 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHead(cx, cy, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.fillStyle = '#f2b400';
  ctx.beginPath();
  ctx.ellipse(-CELL * 0.15, CELL * 0.28, 6, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.ellipse(0, 0, CELL * 0.5, CELL * 0.44, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(CELL * 0.38, -3);
  ctx.lineTo(CELL * 0.72, -1);
  ctx.lineTo(CELL * 0.72, 5);
  ctx.lineTo(CELL * 0.38, 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(CELL * 0.22, -CELL * 0.16, 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function angleForDir(d) {
  return Math.atan2(d.y, d.x);
}

function drawTrain() {
  for (let i = train.length - 1; i > 0; i--) {
    const s = train[i];
    const prev = train[i - 1];
    const a = angleForDir({ x: prev.x - s.x, y: prev.y - s.y });
    drawDuckling(s.x * CELL + CELL / 2, s.y * CELL + CELL / 2, a);
  }
  const head = train[0];
  drawHead(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, angleForDir(dir));
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if (shake < 0.3) shake = 0;
  }

  drawWater();
  drawLilyPads();
  drawBread();
  drawTrain();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>

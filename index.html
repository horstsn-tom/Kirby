<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Flap</title>
  <style>
    :root {
      --bg: #060606;
      --surface: #0e0e0e;
      --phosphor: #e8e8e2;
      --glow: #ffcc33;
      --dim: #333;
      --hint: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', 'Courier', monospace;
      color: var(--phosphor);
      user-select: none;
      overflow: hidden;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #title {
      font-size: 20px;
      letter-spacing: 0.35em;
      font-weight: 700;
      color: var(--glow);
      text-shadow: 0 0 14px var(--glow);
    }

    #scorebar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 480px;
      gap: 40px;
    }

    .score-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--hint);
      text-transform: uppercase;
    }

    .score-num {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--phosphor);
      text-shadow: 0 0 20px rgba(232,232,226,0.35);
    }

    .score-divider {
      width: 2px;
      height: 46px;
      background: #1e1e1e;
      flex-shrink: 0;
    }

    #stage {
      position: relative;
      background: var(--surface);
      box-shadow: 0 0 0 1px #1a1a1a;
    }

    #duck {
      display: block;
    }

    #msg {
      height: 22px;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 10px var(--glow);
      text-align: center;
      padding: 0 10px;
    }

    #controls {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hint);
      text-align: center;
    }

    .key {
      display: inline-block;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 16px;
      color: #555;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="title">DUCK FLAP</div>

  <div id="scorebar">
    <div class="score-side">
      <div class="score-label">Score</div>
      <div class="score-num" id="score">0</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-side">
      <div class="score-label">Best</div>
      <div class="score-num" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="duck" width="480" height="620"></canvas>
  </div>

  <div id="msg">Press Space or Click to Start</div>

  <div id="controls">
    <span class="key">Space</span>&nbsp; / &nbsp;<span class="key">Click</span>&nbsp; Flap &nbsp;&nbsp;
  </div>
</div>

<script>
const canvas = document.getElementById('duck');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

const W = canvas.width, H = canvas.height;
const WATER_Y = H - 90;

const STATE = { WAIT: 0, PLAY: 1, OVER: 2 };
let state = STATE.WAIT;

let best = Number(localStorage.getItem('duckFlapBest') || 0);
bestEl.textContent = best;

const duck = {
  x: 110,
  y: H / 2,
  vy: 0,
  r: 17,
  rot: 0,
  wing: 0,
};

const GRAVITY = 0.42;
const FLAP_VY = -7.6;
const MAX_FALL = 9;

let pipes = [];
const PIPE_W = 66;
let pipeGap = 180;
let pipeSpeed = 3.1;
let frame = 0;
let score = 0;
let shake = 0;

const clouds = [
  { x: 60,  y: 70,  s: 1.0, spd: 0.25 },
  { x: 240, y: 110, s: 0.7, spd: 0.18 },
  { x: 380, y: 55,  s: 0.85, spd: 0.3 },
  { x: 150, y: 160, s: 0.55, spd: 0.15 },
];

let ripple = 0;

function resetGame() {
  duck.y = H / 2;
  duck.vy = 0;
  duck.rot = 0;
  pipes = [];
  pipeGap = 180;
  pipeSpeed = 3.1;
  frame = 0;
  score = 0;
  scoreEl.textContent = 0;
  spawnPipe();
}

function spawnPipe() {
  const margin = 70;
  const gapY = margin + Math.random() * (WATER_Y - margin * 2 - pipeGap);
  pipes.push({ x: W + 10, gapY, passed: false });
}

function flap() {
  if (state === STATE.WAIT) {
    state = STATE.PLAY;
    msgEl.textContent = '';
    duck.vy = FLAP_VY;
  } else if (state === STATE.PLAY) {
    duck.vy = FLAP_VY;
  } else if (state === STATE.OVER) {
    resetGame();
    state = STATE.WAIT;
    msgEl.textContent = 'Press Space or Click to Start';
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

function gameOver() {
  state = STATE.OVER;
  shake = 10;
  if (score > best) {
    best = score;
    localStorage.setItem('duckFlapBest', String(best));
    bestEl.textContent = best;
  }
  msgEl.textContent = `Game Over — Score ${score} — Press Space to Restart`;
}

function update() {
  ripple += 0.06;

  for (const c of clouds) {
    c.x -= c.spd * (state === STATE.PLAY ? 1 : 0.4);
    if (c.x < -60) c.x = W + 60;
  }

  if (state !== STATE.PLAY) {
    duck.wing = Math.sin(frame * 0.15) * 0.4;
    frame++;
    return;
  }

  frame++;

  duck.vy = Math.min(MAX_FALL, duck.vy + GRAVITY);
  duck.y += duck.vy;
  duck.rot = Math.max(-0.5, Math.min(1.1, duck.vy / 10));
  duck.wing = duck.vy < 0 ? Math.sin(frame * 0.6) * 0.9 : Math.sin(frame * 0.3) * 0.3;

  if (duck.y - duck.r < 0) { duck.y = duck.r; duck.vy = 0; }

  for (const p of pipes) {
    p.x -= pipeSpeed;
    if (!p.passed && p.x + PIPE_W < duck.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      pipeSpeed = Math.min(6.5, 3.1 + score * 0.08);
      pipeGap = Math.max(130, 180 - score * 2);
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 240) {
    spawnPipe();
  }

  for (const p of pipes) {
    const inX = duck.x + duck.r > p.x && duck.x - duck.r < p.x + PIPE_W;
    if (inX) {
      const inGap = duck.y - duck.r > p.gapY && duck.y + duck.r < p.gapY + pipeGap;
      if (!inGap) { gameOver(); return; }
    }
  }

  if (duck.y + duck.r > WATER_Y) {
    duck.y = WATER_Y - duck.r;
    gameOver();
    return;
  }
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.s, c.s);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 26, 14, 0, 0, Math.PI * 2);
  ctx.ellipse(20, -6, 18, 12, 0, 0, Math.PI * 2);
  ctx.ellipse(-20, -4, 16, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPipe(p) {
  const topH = p.gapY;
  const botY = p.gapY + pipeGap;
  const botH = WATER_Y - botY;

  const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  grad.addColorStop(0, '#2f7d3a');
  grad.addColorStop(0.5, '#3f9c4c');
  grad.addColorStop(1, '#2a6d34');

  // top reed
  ctx.fillStyle = grad;
  ctx.fillRect(p.x, 0, PIPE_W, topH);
  ctx.fillStyle = '#26602f';
  ctx.fillRect(p.x - 5, topH - 22, PIPE_W + 10, 22);

  // bottom reed
  ctx.fillStyle = grad;
  ctx.fillRect(p.x, botY, PIPE_W, botH);
  ctx.fillStyle = '#26602f';
  ctx.fillRect(p.x - 5, botY, PIPE_W + 10, 22);

  // texture lines
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    const lx = p.x + (PIPE_W / 4) * i;
    ctx.beginPath();
    ctx.moveTo(lx, 0); ctx.lineTo(lx, topH);
    ctx.moveTo(lx, botY); ctx.lineTo(lx, WATER_Y);
    ctx.stroke();
  }
}

function drawWater() {
  const grad = ctx.createLinearGradient(0, WATER_Y, 0, H);
  grad.addColorStop(0, '#3fa9d6');
  grad.addColorStop(1, '#1c5f8a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 4) {
    const y = WATER_Y + Math.sin(x * 0.05 + ripple * 20) * 3;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  for (let i = 0; i < 4; i++) {
    const ly = WATER_Y + 20 + i * 16;
    ctx.beginPath();
    for (let x = -20; x <= W; x += 6) {
      const y = ly + Math.sin(x * 0.03 + ripple * 10 + i) * 2;
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawDuck() {
  ctx.save();
  ctx.translate(duck.x, duck.y);
  ctx.rotate(duck.rot * 0.5);

  // shadow
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(2, duck.r + 4, duck.r * 0.9, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // tail
  ctx.fillStyle = '#f2b400';
  ctx.beginPath();
  ctx.ellipse(-duck.r - 2, 2, 8, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.ellipse(0, 0, duck.r + 4, duck.r, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing
  ctx.save();
  ctx.translate(-2, 2);
  ctx.rotate(duck.wing);
  ctx.fillStyle = '#f2b400';
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // head
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(duck.r - 2, -duck.r + 2, 12, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(duck.r + 8, -duck.r + 2);
  ctx.lineTo(duck.r + 24, -duck.r - 1);
  ctx.lineTo(duck.r + 24, -duck.r + 6);
  ctx.lineTo(duck.r + 8, -duck.r + 7);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(duck.r + 2, -duck.r - 1, 2.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if (shake < 0.3) shake = 0;
  }

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, WATER_Y);
  sky.addColorStop(0, '#7fd4ff');
  sky.addColorStop(1, '#cdeeff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, WATER_Y);

  // sun
  ctx.save();
  ctx.shadowColor = 'rgba(255,230,150,0.9)';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#fff2b0';
  ctx.beginPath();
  ctx.arc(W - 70, 65, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  clouds.forEach(drawCloud);

  pipes.forEach(drawPipe);
  drawWater();
  drawDuck();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>

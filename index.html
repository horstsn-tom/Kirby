<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <style>
    :root {
      --bg: #060606;
      --surface: #0e0e0e;
      --net: #1c1c1c;
      --phosphor: #e8e8e2;
      --glow: #5bff7f;
      --dim: #333;
      --hint: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', 'Courier', monospace;
      color: var(--phosphor);
      user-select: none;
      overflow: hidden;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #scorebar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 800px;
    }

    .score-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .score-num {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--phosphor);
      text-shadow: 0 0 24px rgba(232,232,226,0.35);
    }

    .score-pips {
      display: flex;
      gap: 5px;
    }

    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.15s;
    }

    .pip.lit {
      background: var(--glow);
      box-shadow: 0 0 6px var(--glow);
    }

    .score-divider {
      width: 2px;
      height: 72px;
      background: #1e1e1e;
      flex-shrink: 0;
    }

    #pong {
      display: block;
      background: var(--surface);
    }

    #msg {
      height: 22px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 10px var(--glow);
      text-align: center;
    }

    #controls {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hint);
      text-align: center;
    }

    .key {
      display: inline-block;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 16px;
      color: #555;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="scorebar">
    <div class="score-side">
      <div class="score-num" id="s0">0</div>
      <div class="score-pips" id="pips0"></div>
    </div>
    <div class="score-divider"></div>
    <div class="score-side">
      <div class="score-num" id="s1">0</div>
      <div class="score-pips" id="pips1"></div>
    </div>
  </div>

  <canvas id="pong" width="800" height="460"></canvas>

  <div id="msg">Press Space to Start</div>

  <div id="controls">
    <span class="key">W</span><span class="key">S</span>&nbsp; Left &nbsp;&nbsp;
    <span class="key">↑</span><span class="key">↓</span>&nbsp; Right &nbsp;&nbsp;
    <span class="key">Space</span>&nbsp; Start / Pause
  </div>
</div>

<script>
const canvas  = document.getElementById('pong');
const ctx     = canvas.getContext('2d');
const msgEl   = document.getElementById('msg');
const s0El    = document.getElementById('s0');
const s1El    = document.getElementById('s1');
const pips0El = document.getElementById('pips0');
const pips1El = document.getElementById('pips1');

const W = canvas.width, H = canvas.height;
const PW = 10, PH = 88, PSPEED = 6, WIN = 7;
const PHOSPHOR = '#e8e8e2';
const GLOW     = '#5bff7f';

const game = { running: false, over: false, scores: [0, 0] };

const paddles = [
  { x: 22,           y: H/2 - PH/2, dy: 0 },
  { x: W - 22 - PW, y: H/2 - PH/2, dy: 0 },
];

const ball = { x: W/2, y: H/2, vx: 0, vy: 0, trail: [] };

function buildPips() {
  [pips0El, pips1El].forEach(el => {
    el.innerHTML = '';
    for (let i = 0; i < WIN; i++) {
      const d = document.createElement('div');
      d.className = 'pip';
      el.appendChild(d);
    }
  });
}

function updateUI() {
  s0El.textContent = game.scores[0];
  s1El.textContent = game.scores[1];
  [[pips0El, 0], [pips1El, 1]].forEach(([el, i]) => {
    Array.from(el.children).forEach((pip, j) => {
      pip.classList.toggle('lit', j < game.scores[i]);
    });
  });
  if (game.over) {
    msgEl.textContent = `Player ${game.scores[0] >= WIN ? 1 : 2} wins — Space to restart`;
  } else if (!game.running) {
    msgEl.textContent = 'Press Space to start';
  } else {
    msgEl.textContent = '';
  }
}

function resetBall(dir = 1) {
  ball.x = W/2; ball.y = H/2; ball.trail = [];
  const a = (Math.random() * 0.5 - 0.25);
  ball.vx = dir * 5.2 * Math.cos(a);
  ball.vy = 5.2 * Math.sin(a);
}

function resetGame() {
  game.scores = [0, 0]; game.over = false; game.running = false;
  paddles[0].y = paddles[1].y = H/2 - PH/2;
  resetBall(1); updateUI();
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (game.over) { resetGame(); }
    else { game.running = !game.running; updateUI(); }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function update() {
  if (!game.running || game.over) return;

  paddles[0].dy = keys['KeyW'] ? -PSPEED : keys['KeyS'] ? PSPEED : 0;
  paddles[1].dy = keys['ArrowUp'] ? -PSPEED : keys['ArrowDown'] ? PSPEED : 0;

  for (const p of paddles) {
    p.y = Math.max(0, Math.min(H - PH, p.y + p.dy));
  }

  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 8) ball.trail.shift();

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y <= 0)      { ball.y = 0;      ball.vy =  Math.abs(ball.vy); }
  if (ball.y + 10 >= H) { ball.y = H - 10; ball.vy = -Math.abs(ball.vy); }

  for (let i = 0; i < 2; i++) {
    const p = paddles[i];
    if (ball.x < p.x + PW && ball.x + 10 > p.x &&
        ball.y < p.y + PH && ball.y + 10 > p.y) {
      ball.vx = i === 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
      ball.vy = Math.max(-9, Math.min(9, ball.vy + p.dy * 0.25));
      ball.vx *= 1.06;
      ball.x = i === 0 ? p.x + PW : p.x - 10;
    }
  }

  if (ball.x + 10 < 0) { scored(1); }
  else if (ball.x > W) { scored(0); }
}

function scored(winner) {
  game.scores[winner]++;
  if (game.scores[winner] >= WIN) {
    game.over = true; game.running = false;
  } else {
    resetBall(winner === 0 ? -1 : 1);
    game.running = false;
  }
  updateUI();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Net
  ctx.strokeStyle = '#1c1c1c';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ball trail
  ball.trail.forEach((pt, i) => {
    const a = (i / ball.trail.length) * 0.2;
    ctx.fillStyle = `rgba(91,255,127,${a})`;
    ctx.beginPath();
    ctx.roundRect(pt.x, pt.y, 10, 10, 2);
    ctx.fill();
  });

  // Ball
  if (game.running) { ctx.shadowColor = GLOW; ctx.shadowBlur = 14; }
  ctx.fillStyle = PHOSPHOR;
  ctx.beginPath();
  ctx.roundRect(ball.x, ball.y, 10, 10, 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Paddles
  ctx.shadowColor = 'rgba(232,232,226,0.4)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = PHOSPHOR;
  for (const p of paddles) {
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, PW, PH, 4);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

buildPips();
resetGame();
loop();
</script>
</body>
</html>

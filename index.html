<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Tower</title>
  <style>
    :root {
      --bg: #060606;
      --surface: #0e0e0e;
      --phosphor: #e8e8e2;
      --glow: #ffcc33;
      --dim: #333;
      --hint: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', 'Courier', monospace;
      color: var(--phosphor);
      user-select: none;
      overflow: hidden;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #title {
      font-size: 20px;
      letter-spacing: 0.35em;
      font-weight: 700;
      color: var(--glow);
      text-shadow: 0 0 14px var(--glow);
    }

    #scorebar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 480px;
      gap: 40px;
    }

    .score-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--hint);
      text-transform: uppercase;
    }

    .score-num {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--phosphor);
      text-shadow: 0 0 20px rgba(232,232,226,0.35);
    }

    .score-divider {
      width: 2px;
      height: 46px;
      background: #1e1e1e;
      flex-shrink: 0;
    }

    #stage {
      position: relative;
      background: var(--surface);
      box-shadow: 0 0 0 1px #1a1a1a;
    }

    #duck {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #msg {
      height: 22px;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 10px var(--glow);
      text-align: center;
      padding: 0 10px;
    }

    #controls {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hint);
      text-align: center;
    }

    .key {
      display: inline-block;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 10px;
      line-height: 16px;
      color: #555;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="title">DUCK TOWER</div>

  <div id="scorebar">
    <div class="score-side">
      <div class="score-label">Height</div>
      <div class="score-num" id="score">0</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-side">
      <div class="score-label">Best</div>
      <div class="score-num" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="duck" width="480" height="640"></canvas>
  </div>

  <div id="msg">Press Space or Click to Drop</div>

  <div id="controls">
    <span class="key">Space</span>&nbsp; / &nbsp;<span class="key">Click</span>&nbsp; Drop the Duckling &nbsp;&nbsp;
  </div>
</div>

<script>
const canvas = document.getElementById('duck');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 70;
const TOP_VIEW_Y = 170;
const BLOCK_H = 30;
const BASE_W = 300;
const PERFECT_TOL = 4;

const STATE = { WAIT: 0, PLAY: 1, OVER: 2 };
let state = STATE.WAIT;

let best = Number(localStorage.getItem('duckTowerBest') || 0);
bestEl.textContent = best;

const PALETTE = ['#ffd23f', '#f2b400', '#fff1b8', '#e0a100'];

let stack, current, debris, score, cam, wobble, perfectFlash;

function newMover(w) {
  return { x: 0, w, dir: 1, speed: 2.6 + Math.min(4.5, (stack.length - 1) * 0.12) };
}

function resetGame() {
  stack = [{ x: (W - BASE_W) / 2, w: BASE_W, color: '#e8b04b' }];
  current = newMover(220);
  current.x = 0;
  debris = [];
  score = 0;
  cam = 0;
  wobble = 0;
  perfectFlash = 0;
  scoreEl.textContent = 0;
}

function topWorldY(index) {
  return GROUND_Y - (index + 1) * BLOCK_H;
}

function spawnDebris(x, w, index) {
  debris.push({
    x, w, h: BLOCK_H,
    worldY: topWorldY(index),
    vy: -2 - Math.random() * 2,
    vx: (x + w / 2 < W / 2 ? -1 : 1) * (1.5 + Math.random() * 2),
    rot: 0,
    vrot: (Math.random() - 0.5) * 0.2,
    color: PALETTE[index % PALETTE.length],
  });
}

function startOrRestart() {
  if (state === STATE.WAIT) {
    state = STATE.PLAY;
    msgEl.textContent = '';
  } else if (state === STATE.OVER) {
    resetGame();
    state = STATE.WAIT;
    msgEl.textContent = 'Press Space or Click to Drop';
  }
}

function gameOver() {
  state = STATE.OVER;
  if (score > best) {
    best = score;
    localStorage.setItem('duckTowerBest', String(best));
    bestEl.textContent = best;
  }
  msgEl.textContent = `Tower Fell — Height ${score} — Press Space to Restart`;
}

function drop() {
  const top = stack[stack.length - 1];
  const m = current;
  const overlapStart = Math.max(top.x, m.x);
  const overlapEnd = Math.min(top.x + top.w, m.x + m.w);
  const overlapW = overlapEnd - overlapStart;

  if (overlapW <= 2) {
    spawnDebris(m.x, m.w, stack.length);
    current = null;
    gameOver();
    return;
  }

  const leftW = overlapStart - m.x;
  const rightW = (m.x + m.w) - overlapEnd;
  if (leftW > 1) spawnDebris(m.x, leftW, stack.length);
  if (rightW > 1) spawnDebris(overlapEnd, rightW, stack.length);

  const perfect = Math.abs(m.x - top.x) < PERFECT_TOL && Math.abs(m.w - top.w) < PERFECT_TOL;
  const placedW = perfect ? top.w : overlapW;
  const placedX = perfect ? top.x : overlapStart;

  stack.push({ x: placedX, w: placedW, color: PALETTE[stack.length % PALETTE.length] });
  score++;
  scoreEl.textContent = score;
  if (perfect) { perfectFlash = 14; wobble = 0; } else { wobble = 8; }

  current = newMover(placedW);
  current.x = Math.random() < 0.5 ? 0 : W - placedW;
}

function action() {
  if (state === STATE.WAIT) { startOrRestart(); }
  else if (state === STATE.PLAY) { drop(); }
  else if (state === STATE.OVER) { startOrRestart(); }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); action(); }
});
canvas.addEventListener('mousedown', action);
canvas.addEventListener('touchstart', e => { e.preventDefault(); action(); }, { passive: false });

function update() {
  if (perfectFlash > 0) perfectFlash--;
  if (wobble > 0) wobble--;

  for (const d of debris) {
    d.vy += 0.35;
    d.worldY += d.vy;
    d.x += d.vx;
    d.rot += d.vrot;
  }
  debris = debris.filter(d => d.worldY < H + 400 + cam);

  if (state !== STATE.PLAY || !current) return;

  current.x += current.dir * current.speed;
  if (current.x <= 0) { current.x = 0; current.dir = 1; }
  if (current.x + current.w >= W) { current.x = W - current.w; current.dir = -1; }

  const nextWorldY = topWorldY(stack.length);
  cam = -Math.max(0, TOP_VIEW_Y - nextWorldY);
}

function screenY(worldY) { return worldY - cam; }

function drawSky() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#7fd4ff');
  sky.addColorStop(0.6, '#bfe8ff');
  sky.addColorStop(1, '#2f8fc4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = 'rgba(255,230,150,0.9)';
  ctx.shadowBlur = 36;
  ctx.fillStyle = '#fff2b0';
  ctx.beginPath();
  ctx.arc(W - 60, 70, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBlock(b, worldY, wobbleOffset) {
  const y = screenY(worldY);
  if (y > H || y + BLOCK_H < -40) return;
  const wob = wobbleOffset ? Math.sin(wobble * 0.9) * wobbleOffset : 0;

  ctx.save();
  ctx.translate(0, wob);
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.roundRect(b.x, y, b.w, BLOCK_H, 6);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(b.x + 6, y + BLOCK_H * 0.35);
  ctx.lineTo(b.x + b.w - 6, y + BLOCK_H * 0.35);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.roundRect(b.x + 1.5, y + 1.5, b.w - 3, BLOCK_H - 3, 5);
  ctx.stroke();
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    const y = screenY(d.worldY);
    if (y > H + 20) continue;
    ctx.save();
    ctx.translate(d.x + d.w / 2, y + d.h / 2);
    ctx.rotate(d.rot);
    ctx.globalAlpha = Math.max(0, 1 - d.worldY / (H + 300));
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.roundRect(-d.w / 2, -d.h / 2, d.w, d.h, 5);
    ctx.fill();
    ctx.restore();
  }
}

function drawDuckHead(cx, topY) {
  ctx.save();
  ctx.translate(cx, topY);

  ctx.fillStyle = '#f2b400';
  ctx.beginPath();
  ctx.ellipse(-10, 10, 7, 5, -0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(10, -2);
  ctx.lineTo(26, -4);
  ctx.lineTo(26, 4);
  ctx.lineTo(10, 5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(6, -6, 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFeet() {
  const base = stack[0];
  const y = screenY(GROUND_Y);
  ctx.fillStyle = '#ff8c1a';
  for (const dx of [-30, 30]) {
    const fx = base.x + base.w / 2 + dx;
    ctx.beginPath();
    ctx.moveTo(fx, y);
    ctx.lineTo(fx - 8, y + 12);
    ctx.lineTo(fx, y + 8);
    ctx.lineTo(fx + 8, y + 12);
    ctx.closePath();
    ctx.fill();
  }
}

function drawWater() {
  const y = screenY(GROUND_Y) + BLOCK_H;
  if (y > H) return;
  const grad = ctx.createLinearGradient(0, y, 0, H);
  grad.addColorStop(0, '#3fa9d6');
  grad.addColorStop(1, '#1c5f8a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y, W, H - y);
}

function draw() {
  drawSky();

  for (let i = 0; i < stack.length; i++) {
    drawBlock(stack[i], topWorldY(i), i === stack.length - 1 ? wobble * 0.4 : 0);
  }
  drawFeet();
  drawWater();
  drawDebris();

  if (current) {
    const worldY = topWorldY(stack.length);
    drawBlock({ x: current.x, w: current.w, color: PALETTE[stack.length % PALETTE.length] }, worldY);
    drawDuckHead(current.x + current.w / 2, screenY(worldY) - 16);
  }

  if (perfectFlash > 0) {
    ctx.save();
    ctx.globalAlpha = perfectFlash / 14 * 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>

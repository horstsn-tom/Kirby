<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Parkour</title>
<style>
  :root {
    --bg-deep: #0b0f1a;
    --bg-panel: rgba(14, 19, 32, 0.94);
    --border: #3a4a66;
    --border-soft: #263248;
    --text: #e8ecf4;
    --text-dim: #8896ab;
    --text-dimmer: #5c6a82;
    --accent: #7fd7ff;
    --accent-glow: rgba(127, 215, 255, 0.5);
    --gold: #ffd76f;
    --danger: #ff5a5a;
    --success: #5cff9d;
    --clone: #4fc3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  body {
    background: linear-gradient(var(--bg-deep), #131a2a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
    color: var(--text);
  }
  h1 {
    margin-bottom: 8px;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 8px var(--accent-glow);
  }
  #stage {
    position: relative;
    width: 960px;
    max-width: 96vw;
  }
  canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 960 / 540;
    border: 2px solid var(--border);
    border-radius: 6px;
    display: block;
    background: #101625;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
  }
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel {
    pointer-events: auto;
    width: min(480px, 90%);
    max-height: 88%;
    overflow-y: auto;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 26px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(2px);
  }
  .panel.hidden { display: none; }
  .panel h2 {
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-shadow: 0 0 8px var(--accent-glow);
    text-align: center;
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .panel .sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: #1a2438;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 8px;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    text-align: center;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 12px rgba(127, 215, 255, 0.25); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text-dim); }
  .level-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .level-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: #1a2438;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .level-btn:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 12px rgba(127, 215, 255, 0.25); }
  .level-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .level-btn.locked { opacity: 0.45; cursor: not-allowed; }
  .level-best { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .menu-actions { display: flex; flex-direction: column; gap: 0; }
  .battery-count { color: var(--gold); font-variant-numeric: tabular-nums; }
  .battery-count.top { text-align: center; font-size: 15px; margin-bottom: 14px; }
  .upgrade-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .upgrade-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: #141d30;
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 10px 12px;

  .upgrade-name { font-size: 13px; }
  .upgrade-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .pips { margin-left: 8px; display: inline-flex; gap: 3px; vertical-align: middle; }

  .stats { display: flex; justify-content: space-around; margin-bottom: 16px; font-size: 13px; }

    justify-content: space-between;

  <h1>ROBOT PARKOUR</h1>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    </div>
  </div>
  <div id="hud">

  <div id="ui">
    <span class="key">A</span>/<span class="key">D</span> move &nbsp;|&nbsp;
    <span class="key">SPACE</span> jump &nbsp;|&nbsp;

    <span class="key">SHIFT</span> dash &nbsp;|&nbsp;

    <span class="key">P</span> pause &nbsp;|&nbsp;

<script>
// =======================================================================
// Constants
// =======================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');

const deathsEl = document.getElementById('deaths');

const W = canvas.width, H = canvas.height;
const GRAVITY = 0.65;
const BASE_MOVE_SPEED = 5;
const BASE_JUMP_VELOCITY = -13.5;
const BASE_CLONE_REACH = 170;
const PLAYER_W = 28, PLAYER_H = 40;

const WALL_JUMP_PUSH_SPEED = 8;
const WALL_JUMP_LOCK_FRAMES = 14;
const WALL_COYOTE_FRAMES = 6;
const WALL_SLIDE_MAX_FALL = 3.5;

const DASH_SPEED = 11;
const DASH_FRAMES = 12;
const DASH_COOLDOWN_FRAMES = 42;

// =======================================================================
// Save data & upgrades
// =======================================================================
const SAVE_KEY = 'robotParkourSaveV2';

function loadSave() {
  const fallback = { batteries: 0, upgrades: { jump: 0, speed: 0, reach: 0, clones: 0 }, bestTimes: {}, unlocked: 1, muted: false };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return Object.assign({}, fallback, parsed, { upgrades: Object.assign({}, fallback.upgrades, parsed.upgrades) });
  } catch {
    return fallback;
  }
}
let save = loadSave();
function persist() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

const UPGRADES = {
  jump:   { label: 'Jump Power',        desc: '+8% jump height per tier',        max: 3, cost: [4, 8, 14], effect: t => 1 + t * 0.08 },
  speed:  { label: 'Speed Boost',       desc: '+8% move speed per tier',         max: 3, cost: [4, 8, 14], effect: t => 1 + t * 0.08 },
  reach:  { label: 'Clone Reach',       desc: '+25% clone-jump radius per tier', max: 3, cost: [3, 6, 10], effect: t => 1 + t * 0.25 },
  clones: { label: 'Extra Clone Charge', desc: 'Carry +1 clone at once per tier', max: 2, cost: [10, 18], effect: t => 1 + t },
};

function effectiveMoveSpeed() { return BASE_MOVE_SPEED * UPGRADES.speed.effect(save.upgrades.speed); }
function effectiveJumpVelocity() { return BASE_JUMP_VELOCITY * UPGRADES.jump.effect(save.upgrades.jump); }
function effectiveCloneReach() { return BASE_CLONE_REACH * UPGRADES.reach.effect(save.upgrades.reach); }
function effectiveMaxClones() { return UPGRADES.clones.effect(save.upgrades.clones); }

function buyUpgrade(key) {
  const cfg = UPGRADES[key];
  const tier = save.upgrades[key];
  if (tier >= cfg.max) return;
  const cost = cfg.cost[tier];
  if (save.batteries < cost) return;
  save.batteries -= cost;
  save.upgrades[key] = tier + 1;
  persist();
  Sound.uiBuy();
  renderShop();
}

// =======================================================================
// Sound engine (procedural, Web Audio API — no external assets)
// =======================================================================
const Sound = (() => {
  let ctx = null, masterGain = null, ambientRunning = false, ambientTimer = null, ambientStep = 0;
  const AMBIENT_NOTES = [220, 261.6, 329.6, 392, 440, 392, 329.6, 261.6];

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = save.muted ? 0 : 1;
    masterGain.connect(ctx.destination);
  }

  function tone({ freq = 440, dur = 0.12, type = 'sine', gain = 0.15, glideTo = null, delay = 0 }) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(glideTo, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function scheduleAmbient() {
    if (!ambientRunning) return;
    const freq = AMBIENT_NOTES[ambientStep % AMBIENT_NOTES.length];
    tone({ freq, dur: 0.5, type: 'sine', gain: 0.035 });
    tone({ freq: freq / 2, dur: 0.5, type: 'sine', gain: 0.02 });
    ambientStep++;
    ambientTimer = setTimeout(scheduleAmbient, 420);
  }

  return {
    jump: () => { ensure(); tone({ freq: 420, glideTo: 640, dur: 0.12, type: 'square', gain: 0.15 }); },
    clonePlace: () => { ensure(); tone({ freq: 300, glideTo: 500, dur: 0.1, type: 'sawtooth', gain: 0.1 }); tone({ freq: 600, dur: 0.08, type: 'sine', gain: 0.08, delay: 0.05 }); },
    cloneJump: () => { ensure(); tone({ freq: 500, glideTo: 900, dur: 0.18, type: 'square', gain: 0.18 }); },
    wallJump: () => { ensure(); tone({ freq: 460, glideTo: 760, dur: 0.14, type: 'sawtooth', gain: 0.16 }); },
    dash: () => { ensure(); tone({ freq: 900, glideTo: 300, dur: 0.13, type: 'sawtooth', gain: 0.15 }); },
    death: () => { ensure(); tone({ freq: 300, glideTo: 60, dur: 0.35, type: 'sawtooth', gain: 0.2 }); },
    batteryPickup: () => { ensure(); tone({ freq: 700, dur: 0.08, type: 'sine', gain: 0.15 }); tone({ freq: 1000, dur: 0.1, type: 'sine', gain: 0.12, delay: 0.06 }); },
    checkpoint: () => { ensure(); tone({ freq: 500, dur: 0.1, type: 'triangle', gain: 0.12 }); tone({ freq: 750, dur: 0.15, type: 'triangle', gain: 0.1, delay: 0.08 }); },
    win: () => { ensure(); [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.22, type: 'square', gain: 0.15, delay: i * 0.11 })); },
    uiClick: () => { ensure(); tone({ freq: 800, dur: 0.05, type: 'square', gain: 0.08 }); },
    uiBuy: () => { ensure(); tone({ freq: 600, glideTo: 1000, dur: 0.15, type: 'square', gain: 0.15 }); },
    startAmbient: () => { if (ambientRunning) return; ensure(); ambientRunning = true; scheduleAmbient(); },
    setMuted: m => { if (masterGain) masterGain.gain.value = m ? 0 : 1; },
    ensure,
  };
})();

function toggleMute() {
  save.muted = !save.muted;
  persist();
  Sound.setMuted(save.muted);
  if (gameState === 'menu') renderMenu();
  if (gameState === 'paused') renderPause();
}

// =======================================================================
// Levels
// =======================================================================
function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function seededRandom(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function buildSkyline(levelWidth, seed) {
  const rng = seededRandom(seed);
  const buildings = [];
  let x = -200;
  while (x < levelWidth + 400) {
    const w = 60 + rng() * 100;
    const h = 80 + rng() * 220;
    buildings.push({ x, w, h });
    x += w + 10 + rng() * 40;
  }
  return buildings;
}

// =======================================================================
// Game state
// =======================================================================
let gameState = 'menu'; // 'menu' | 'playing' | 'paused' | 'levelComplete'
let currentLevelIndex = 0;

let cameraX = 0;
let runElapsedMs = 0;
let deaths = 0;

const keys = {};

  dashing: false, dashFramesLeft: 0, dashCooldownFrames: 0, dashDir: 1,

let clones = []; // { x, y, w, h }
let particles = [];

function showToast(text, ms = 1300) {
  messageEl.textContent = text;
  messageEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { messageEl.style.opacity = '0'; }, ms);
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 15, color });
  }
}

function loadLevel(index) {
  currentLevelIndex = index;
  level = LEVELS[index];
  for (const cp of level.checkpoints) cp.active = false;
  for (const b of level.batteries) b.collected = false;
}

function resetRunState() {
  player.x = level.startX; player.y = level.startY;
  player.vx = 0; player.vy = 0; player.grounded = false; player.facing = 1;
  player.runCycle = 0; player.squashX = 1; player.squashY = 1;
  player.touchingWallSide = 0; player.wallCoyote = 0; player.wallJumpLockFrames = 0; player.wallJumpVx = 0;
  player.dashing = false; player.dashFramesLeft = 0; player.dashCooldownFrames = 0;
  respawnPoint = { x: level.startX, y: level.startY };
  clones = [];
  particles = [];
  deaths = 0;
  runElapsedMs = 0;
  runBatteriesCollected = 0;
  for (const cp of level.checkpoints) cp.active = false;
  for (const b of level.batteries) b.collected = false;
}

function respawnPlayer() {
  player.x = respawnPoint.x; player.y = respawnPoint.y;
  player.vx = 0; player.vy = 0; player.grounded = false;
  player.touchingWallSide = 0; player.wallCoyote = 0; player.wallJumpLockFrames = 0;
  player.dashing = false; player.dashFramesLeft = 0;
  clones = [];
}

function die() {
  deaths++;
  Sound.death();
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff5a5a', 18);
  respawnPlayer();
}

// ---- Panel/state transitions ----
function hideAllPanels() {
  panelMenu.classList.add('hidden');
  panelShop.classList.add('hidden');
  panelPause.classList.add('hidden');
  panelComplete.classList.add('hidden');
}
function showPanel(panel) { hideAllPanels(); panel.classList.remove('hidden'); }

function showMenu() {
  gameState = 'menu';
  renderMenu();
  showPanel(panelMenu);
}
function showShop() {
  renderShop();
  showPanel(panelShop);
}
function startLevel(index) {
  if (index >= LEVELS.length) { showMenu(); return; }
  if (index + 1 > save.unlocked) return;
  loadLevel(index);
  resetRunState();
  gameState = 'playing';
  hideAllPanels();
  Sound.startAmbient();
}
function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  renderPause();
  showPanel(panelPause);
}
function resumeGame() {
  gameState = 'playing';
  hideAllPanels();
}
function restartLevel() {
  resetRunState();
  gameState = 'playing';
  hideAllPanels();
}
function quitToMenu() { showMenu(); }

function completeLevel() {
  const timeSec = runElapsedMs / 1000;
  const prevBest = save.bestTimes[level.id];
  const isNewBest = prevBest == null || timeSec < prevBest;
  if (isNewBest) save.bestTimes[level.id] = timeSec;
  if (currentLevelIndex + 2 > save.unlocked) save.unlocked = currentLevelIndex + 2;
  persist();
  Sound.win();
  gameState = 'levelComplete';
  renderComplete({ time: timeSec, deaths, batteries: runBatteriesCollected, isNewBest });
  showPanel(panelComplete);
}

// =======================================================================
// UI rendering
// =======================================================================
function renderMenu() {
  const rows = LEVELS.map((lvl, i) => {
    const locked = i + 1 > save.unlocked;
    const best = save.bestTimes[lvl.id];
    const bestStr = best != null ? best.toFixed(1) + 's' : '--';
    if (locked) {
      return `<button class="level-btn locked" disabled><span>🔒 ${lvl.name}</span><span class="level-best">Locked</span></button>`;
    }
    return `<button class="level-btn" data-action="start-level" data-level="${i}"><span>${lvl.name}</span><span class="level-best">Best: ${bestStr}</span></button>`;
  }).join('');
  panelMenu.innerHTML = `
    <h2>ROBOT PARKOUR</h2>
    <p class="sub">Clone yourself. Jump off the clone. Don't fall.</p>
    <div class="level-list">${rows}</div>
    <div class="menu-actions">
      <button class="btn" data-action="open-shop">⚙ Upgrade Shop &nbsp; <span class="battery-count">🔋 ${save.batteries}</span></button>
      <button class="btn ghost" data-action="toggle-mute">${save.muted ? '🔇 Sound: Off' : '🔊 Sound: On'}</button>
    </div>
  `;
}

function renderShop() {
  const rows = Object.entries(UPGRADES).map(([key, cfg]) => {
    const tier = save.upgrades[key];
    const maxed = tier >= cfg.max;
    const cost = maxed ? null : cfg.cost[tier];
    const afford = !maxed && save.batteries >= cost;
    const pips = Array.from({ length: cfg.max }, (_, i) => `<span class="pip ${i < tier ? 'filled' : ''}"></span>`).join('');
    return `
    <div class="upgrade-row">
      <div>
        <div class="upgrade-name">${cfg.label}<span class="pips">${pips}</span></div>
        <div class="upgrade-desc">${cfg.desc}</div>
      </div>
      <button class="btn buy-btn" ${(!afford || maxed) ? 'disabled' : ''} data-action="buy-upgrade" data-key="${key}">${maxed ? 'MAXED' : `🔋 ${cost}`}</button>
    </div>`;
  }).join('');
  panelShop.innerHTML = `
    <h2>Upgrade Shop</h2>
    <div class="battery-count top">🔋 ${save.batteries}</div>
    <div class="upgrade-list">${rows}</div>
    <button class="btn ghost" data-action="back-to-menu">← Back</button>
  `;
}

function renderPause() {
  panelPause.innerHTML = `
    <h2>Paused</h2>
    <button class="btn" data-action="resume">▶ Resume</button>
    <button class="btn" data-action="restart-level">↺ Restart Level</button>
    <button class="btn ghost" data-action="quit-to-menu">☰ Level Select</button>
    <button class="btn ghost" data-action="toggle-mute">${save.muted ? '🔇 Sound: Off' : '🔊 Sound: On'}</button>
  `;
}

function renderComplete({ time, deaths, batteries, isNewBest }) {
  const hasNext = currentLevelIndex + 1 < LEVELS.length;
  panelComplete.innerHTML = `
    <h2>${isNewBest ? '🏆 New Best!' : 'Level Complete'}</h2>
    <div class="stats">
      <div>Time<b>${time.toFixed(1)}s</b></div>
      <div>Deaths<b>${deaths}</b></div>
      <div>Batteries<b>+${batteries} 🔋</b></div>
    </div>
    <div class="complete-actions">
      ${hasNext ? '<button class="btn" data-action="next-level">Next Level →</button>' : ''}
      <button class="btn ${hasNext ? 'ghost' : ''}" data-action="replay-level">↺ Replay</button>
      <button class="btn ghost" data-action="quit-to-menu">☰ Level Select</button>
    </div>
  `;
}

overlay.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  Sound.uiClick();
  switch (el.dataset.action) {
    case 'start-level': startLevel(parseInt(el.dataset.level, 10)); break;
    case 'open-shop': showShop(); break;
    case 'back-to-menu': showMenu(); break;
    case 'buy-upgrade': buyUpgrade(el.dataset.key); break;
    case 'resume': resumeGame(); break;
    case 'restart-level': restartLevel(); break;
    case 'quit-to-menu': quitToMenu(); break;
    case 'toggle-mute': toggleMute(); break;
    case 'next-level': startLevel(currentLevelIndex + 1); break;
    case 'replay-level': startLevel(currentLevelIndex); break;
  }
});

// =======================================================================
// Input
// =======================================================================
document.addEventListener('keydown', e => {
  Sound.ensure();
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (gameState === 'playing') tryJump();
  }
  if (e.code === 'KeyE') {
    e.preventDefault();
    if (gameState === 'playing') tryDropClone();
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    e.preventDefault();
    if (gameState === 'playing') tryDash();
  }
  if (e.code === 'KeyR') {
    e.preventDefault();
    if (gameState === 'playing' || gameState === 'paused') restartLevel();
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
  if (e.code === 'KeyM') {
    e.preventDefault();
    toggleMute();
  }
  if (e.code === 'Enter' && gameState === 'menu') {
    startLevel(Math.max(0, save.unlocked - 1));
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function tryJump() {
  if (player.grounded) {
    player.vy = effectiveJumpVelocity();
    player.grounded = false;
    player.squashX = 0.8; player.squashY = 1.25;
    Sound.jump();
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#7fd7ff', 8);
    return;
  }
  if (player.touchingWallSide !== 0 && player.wallCoyote > 0) {
    player.vy = effectiveJumpVelocity();
    player.wallJumpVx = -player.touchingWallSide * WALL_JUMP_PUSH_SPEED;
    player.wallJumpLockFrames = WALL_JUMP_LOCK_FRAMES;
    player.facing = -player.touchingWallSide;
    player.squashX = 0.75; player.squashY = 1.3;
    Sound.wallJump();
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#4fc3ff', 16);
    player.touchingWallSide = 0;
    player.wallCoyote = 0;
    return;
  }
  if (clones.length === 0) return;
  const reach = effectiveCloneReach();
  let bestIdx = -1, bestDist = Infinity;
  clones.forEach((c, i) => {
    const dx = (player.x + player.w / 2) - (c.x + c.w / 2);
    const dy = (player.y + player.h / 2) - (c.y + c.h / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= reach && dist < bestDist) { bestDist = dist; bestIdx = i; }
  });
  if (bestIdx === -1) return;
  const c = clones[bestIdx];
  player.vy = effectiveJumpVelocity() * 1.07; // clone jump slightly stronger than a plain jump
  player.squashX = 0.75; player.squashY = 1.3;
  Sound.cloneJump();
  spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd76f', 22);
  clones.splice(bestIdx, 1);
}

function tryDropClone() {
  if (!player.grounded) return; // must be grounded to add/recharge a clone
  if (clones.length >= effectiveMaxClones()) return;
  const c = { x: player.x, y: player.y, w: PLAYER_W, h: PLAYER_H };
  clones.push(c);
  Sound.clonePlace();
  spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#5adfff', 14);
}

function tryDash() {
  // grounded-only: a dash mid-jump would extend jump arcs far enough to
  // trivialize gaps that are meant to require a clone double jump.
  if (!player.grounded) return;
  if (player.dashCooldownFrames > 0 || player.dashing) return;
  player.dashing = true;
  player.dashFramesLeft = DASH_FRAMES;
  player.dashDir = player.facing;
  player.dashCooldownFrames = DASH_COOLDOWN_FRAMES;
  Sound.dash();
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#7fd7ff', 10);
}

// =======================================================================
// Physics / collision
// =======================================================================
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveAndCollide(dx, dy) {
  player.x += dx;
  for (const p of level.platforms) {
    if (p.oneWay) continue; // one-way platforms only collide when landing from above
    if (rectsOverlap(player, p)) {
      if (dx > 0) player.x = p.x - player.w;
      else if (dx < 0) player.x = p.x + p.w;
    }
  }
  player.x = Math.max(0, Math.min(level.width - player.w, player.x));

  player.y += dy;
  const wasGrounded = player.grounded;
  player.grounded = false;
  for (const p of level.platforms) {
    if (p.oneWay && dy <= 0) continue; // pass through freely while rising
    if (rectsOverlap(player, p)) {
      if (dy > 0) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; }
      else if (dy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }
  if (player.grounded && !wasGrounded) {
    player.squashX = 1.25; player.squashY = 0.8;
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#8fa5c8', 6);
  }
}

// Probes just outside the player's left/right edges for `wall:true` platforms,
// independent of movement direction — lets the player wall-jump while sliding
// down a wall even with zero horizontal input.
function updateWallContact() {
  if (player.grounded) { player.touchingWallSide = 0; return; }
  const rightProbe = { x: player.x + player.w, y: player.y + 2, w: 1, h: player.h - 4 };
  const leftProbe = { x: player.x - 1, y: player.y + 2, w: 1, h: player.h - 4 };
  let side = 0;
  for (const p of level.platforms) {
    if (!p.wall) continue;
    if (rectsOverlap(rightProbe, p)) { side = 1; break; }
    if (rectsOverlap(leftProbe, p)) { side = -1; break; }
  }
  if (side !== 0) {
    player.touchingWallSide = side;
    player.wallCoyote = WALL_COYOTE_FRAMES;
  } else if (player.wallCoyote > 0) {
    player.wallCoyote--;
    if (player.wallCoyote <= 0) player.touchingWallSide = 0;
  } else {
    player.touchingWallSide = 0;
  }
}

function update() {
  if (gameState !== 'playing') return;

  if (player.dashCooldownFrames > 0) player.dashCooldownFrames--;

  if (player.dashing) {
    player.vx = player.dashDir * DASH_SPEED;
    player.vy = 0; // flat burst — gravity paused for the duration of the dash
    player.dashFramesLeft--;
    if (player.dashFramesLeft <= 0) player.dashing = false;
    particles.push({
      x: player.x + player.w / 2 - player.dashDir * player.w / 2, y: player.y + player.h / 2,
      vx: 0, vy: 0, life: 10, color: '#7fd7ff',
    });
  } else if (player.wallJumpLockFrames > 0) {
    player.vx = player.wallJumpVx;
    player.wallJumpLockFrames--;
    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 22);
  } else {
    let move = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) move -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) move += 1;
    player.vx = move * effectiveMoveSpeed();
    if (move !== 0) player.facing = move;

    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 22);

    if (!player.grounded && player.touchingWallSide !== 0 && player.vy > WALL_SLIDE_MAX_FALL) {
      const pressingIn = (player.touchingWallSide === 1 && move > 0) || (player.touchingWallSide === -1 && move < 0);
      if (pressingIn) player.vy = WALL_SLIDE_MAX_FALL;
    }
  }

  moveAndCollide(player.vx, 0);
  moveAndCollide(0, player.vy);
  updateWallContact();

  if (player.grounded && Math.abs(player.vx) > 0.1 && !player.dashing) player.runCycle += 0.35;
  player.squashX += (1 - player.squashX) * 0.25;
  player.squashY += (1 - player.squashY) * 0.25;

  if (player.y > H + 200) die();

  for (const s of level.spikes) {
    if (rectsOverlap(player, s)) { die(); break; }
  }

  for (const cp of level.checkpoints) {
    if (!cp.active && rectsOverlap(player, cp)) {
      cp.active = true;
      respawnPoint = { x: cp.spawnX, y: cp.spawnY };
      Sound.checkpoint();
      showToast('Checkpoint!');
      spawnParticles(cp.x + cp.w / 2, cp.y + cp.h / 2, '#5cff9d', 12);
    }
  }

  for (const b of level.batteries) {
    if (!b.collected && rectsOverlap(player, { x: b.x - 8, y: b.y - 10, w: 16, h: 20 })) {
      b.collected = true;
      save.batteries++;
      runBatteriesCollected++;
      persist();
      Sound.batteryPickup();
      showToast('+1 🔋');
      spawnParticles(b.x, b.y, '#ffd76f', 10);
    }
  }

  if (rectsOverlap(player, level.goal)) {
    completeLevel();
  }

  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  const targetCam = player.x - W / 2 + player.w / 2;
  cameraX = Math.max(0, Math.min(level.width - W, targetCam));
}

// =======================================================================
// Drawing
// =======================================================================
function drawRobot(x, y, w, h, opts) {
  const { color, eyeColor, dashed, facing, legPhase = null, airborne = false, squashX = 1, squashY = 1 } = opts;
  ctx.save();
  ctx.translate(x - cameraX + w / 2, y + h);
  ctx.scale(squashX, squashY);
  ctx.translate(-w / 2, -h);

  if (dashed) { ctx.setLineDash([4, 4]); ctx.globalAlpha = 0.55; }

  ctx.fillStyle = color;
  if (airborne) {
    ctx.fillRect(w * 0.15, h * 0.78, w * 0.25, h * 0.2);
    ctx.fillRect(w * 0.6, h * 0.78, w * 0.25, h * 0.2);
  } else {
    const off = legPhase != null ? Math.sin(legPhase) * h * 0.12 : 0;
    ctx.fillRect(w * 0.12, h * 0.8 + Math.max(0, off), w * 0.28, h * 0.2 - Math.max(0, off));
    ctx.fillRect(w * 0.6, h * 0.8 + Math.max(0, -off), w * 0.28, h * 0.2 - Math.max(0, -off));
  }

  ctx.beginPath();
  ctx.roundRect(0, h * 0.28, w, h * 0.55, 5);
  ctx.fill();

  ctx.beginPath();
  ctx.roundRect(w * 0.1, 0, w * 0.8, h * 0.32, 4);
  ctx.fill();

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w / 2, 0);
  ctx.lineTo(w / 2, -8);
  ctx.stroke();
  ctx.fillStyle = eyeColor;
  ctx.beginPath();
  ctx.arc(w / 2, -8, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = eyeColor;
  const eyeX = facing >= 0 ? w * 0.55 : w * 0.2;
  ctx.beginPath();
  ctx.roundRect(eyeX, h * 0.1, w * 0.25, h * 0.1, 2);
  ctx.fill();

  if (dashed) { ctx.setLineDash([]); ctx.globalAlpha = 1; }
  ctx.restore();
}

function drawSkyline(buildings, factor, color) {
  ctx.fillStyle = color;
  for (const b of buildings) {
    const sx = b.x - cameraX * factor;
    if (sx + b.w < 0 || sx > W) continue;
    ctx.fillRect(sx, H - b.h, b.w, b.h);
  }
}

function drawBattery(x, y, t) {
  const bob = Math.sin(t * 0.05 + x) * 5;
  const sx = x - cameraX;
  const sy = y + bob;
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 18);
  glow.addColorStop(0, 'rgba(255, 215, 111, 0.35)');
  glow.addColorStop(1, 'rgba(255, 215, 111, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sx - 18, sy - 18, 36, 36);
  ctx.fillStyle = '#ffd76f';
  ctx.beginPath();
  ctx.roundRect(sx - 7, sy - 9, 14, 18, 2);
  ctx.fill();
  ctx.fillRect(sx - 3, sy - 12, 6, 3);
  ctx.fillStyle = '#4a3300';
  ctx.fillRect(sx - 1.5, sy - 5, 3, 10);
}

function drawCheckpoint(cp) {
  const sx = cp.x - cameraX;
  const color = cp.active ? '#5cff9d' : '#5a7fb8';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx + cp.w / 2, cp.y);
  ctx.lineTo(sx + cp.w / 2, cp.y + cp.h);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(sx + cp.w / 2, cp.y);
  ctx.lineTo(sx + cp.w / 2 + 16, cp.y + 6);
  ctx.lineTo(sx + cp.w / 2, cp.y + 12);
  ctx.closePath();
  ctx.fill();
  if (cp.active) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let frameCount = 0;
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#101625';
  ctx.fillRect(0, 0, W, H);

  drawSkyline(level._skyFar, 0.12, '#161f33');
  drawSkyline(level._skyNear, 0.28, '#1c2740');

  ctx.strokeStyle = 'rgba(127,215,255,0.05)';
  ctx.lineWidth = 1;
  const gridOffset = -(cameraX * 0.45) % 60;
  for (let gx = gridOffset; gx < W; gx += 60) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }

  for (const p of level.platforms) {
    const sx = p.x - cameraX;
    if (sx + p.w < 0 || sx > W) continue;
    if (p.wall) {
      const grad = ctx.createLinearGradient(sx, 0, sx + p.w, 0);
      grad.addColorStop(0, '#1c2438');
      grad.addColorStop(0.5, '#2d4a66');
      grad.addColorStop(1, '#1c2438');
      ctx.fillStyle = grad;
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.strokeStyle = 'rgba(127,215,255,0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(sx + 2, p.y + 2, p.w - 4, p.h - 4);
      ctx.setLineDash([]);
      continue;
    }
    if (p.oneWay) {
      ctx.fillStyle = 'rgba(90,127,184,0.55)';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.strokeStyle = 'rgba(127,215,255,0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 5]);
      ctx.beginPath(); ctx.moveTo(sx, p.y); ctx.lineTo(sx + p.w, p.y); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const grad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    grad.addColorStop(0, '#3a4a66');
    grad.addColorStop(1, '#1c2438');
    ctx.fillStyle = grad;
    ctx.fillRect(sx, p.y, p.w, p.h);
    ctx.fillStyle = '#5a7fb8';
    ctx.fillRect(sx, p.y, p.w, 4);
  }

  for (const s of level.spikes) {
    const sx = s.x - cameraX;
    if (sx + s.w < 0 || sx > W) continue;
    ctx.fillStyle = '#ff5a5a';
    const count = Math.max(1, Math.round(s.w / 20));
    const spikeW = s.w / count;
    for (let i = 0; i < count; i++) {
      ctx.beginPath();
      ctx.moveTo(sx + i * spikeW, s.y + s.h);
      ctx.lineTo(sx + i * spikeW + spikeW / 2, s.y);
      ctx.lineTo(sx + i * spikeW + spikeW, s.y + s.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  for (const cp of level.checkpoints) drawCheckpoint(cp);
  for (const b of level.batteries) if (!b.collected) drawBattery(b.x, b.y, frameCount);

  const gx = level.goal.x - cameraX;
  if (gx + level.goal.w > 0 && gx < W) {
    ctx.fillStyle = '#3a4a66';
    ctx.fillRect(gx, level.goal.y, 6, level.goal.h);
    ctx.fillStyle = '#7fd7ff';
    ctx.beginPath();
    ctx.moveTo(gx + 6, level.goal.y);
    ctx.lineTo(gx + level.goal.w, level.goal.y + 12);
    ctx.lineTo(gx + 6, level.goal.y + 24);
    ctx.closePath();
    ctx.fill();
  }

  if (!player.grounded && clones.length > 0) {
    const reach = effectiveCloneReach();
    for (const c of clones) {
      const dx = (player.x + player.w / 2) - (c.x + c.w / 2);
      const dy = (player.y + player.h / 2) - (c.y + c.h / 2);
      const inReach = Math.sqrt(dx * dx + dy * dy) <= reach;
      ctx.strokeStyle = inReach ? 'rgba(255,215,111,0.35)' : 'rgba(255,215,111,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x + c.w / 2 - cameraX, c.y + c.h / 2, reach, 0, Math.PI * 2);
      ctx.stroke();
      if (inReach) {
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(255,215,111,0.4)';
        ctx.beginPath();
        ctx.moveTo(c.x + c.w / 2 - cameraX, c.y + c.h / 2);
        ctx.lineTo(player.x + player.w / 2 - cameraX, player.y + player.h / 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  for (const c of clones) {
    drawRobot(c.x, c.y, c.w, c.h, { color: '#4fc3ff', eyeColor: '#0d2a3a', dashed: true, facing: 1 });
  }

  drawRobot(player.x, player.y, player.w, player.h, {
    color: '#e8ecf4', eyeColor: '#ff9f4f', dashed: false, facing: player.facing,
    legPhase: player.grounded ? player.runCycle : null, airborne: !player.grounded,
    squashX: player.squashX, squashY: player.squashY,
  });

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 30);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - cameraX - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

// =======================================================================
// Main loop
// =======================================================================
let lastNow = performance.now();
function tick(now) {
  const dt = now - lastNow;
  lastNow = now;
  frameCount++;

  if (gameState === 'playing') {
    runElapsedMs += dt;
    update();
  }
  if (level) draw();

  timerEl.textContent = `Time: ${(runElapsedMs / 1000).toFixed(1)}s`;
  deathsEl.textContent = `Deaths: ${deaths}`;
  cloneStatusEl.textContent = `Clones: ${clones.length}/${effectiveMaxClones()}`;
  dashStatusEl.textContent = player.dashCooldownFrames > 0 ? `Dash: ${Math.ceil(player.dashCooldownFrames / 60 * 10) / 10}s` : 'Dash: ready';
  batteryHudEl.textContent = `🔋 ${save.batteries}`;

  requestAnimationFrame(tick);
}

Sound.setMuted(save.muted);
showMenu();
requestAnimationFrame(tick);
</script>
</body>
</html>

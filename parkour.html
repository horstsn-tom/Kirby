<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parkour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #10141c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  canvas {
    border: 2px solid #444;
    display: block;
    background: #1a2030;
  }
  #ui {
    margin-top: 10px;
    font-size: 13px;
    color: #99a;
    text-align: center;
    max-width: 960px;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="ui">
  A/D or ←/→ — Move &nbsp;|&nbsp; SPACE/W/↑ — Jump (hold near a wall to wall-jump) &nbsp;|&nbsp;
  R — Restart Level &nbsp;|&nbsp; N — Skip Level &nbsp;|&nbsp; 1-5 — Jump to Level
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------------------------------------------------------------
// Level definitions
// ---------------------------------------------------------------
function buildLevels() {
  const levels = [];

  // Level 1 - basics: running and jumping across gaps
  levels.push({
    name: 'First Steps',
    height: H,
    start: { x: 40, y: H - 120 },
    platforms: [
      { x: 0,   y: H - 40, w: 260, h: 40 },
      { x: 340, y: H - 40, w: 180, h: 40 },
      { x: 600, y: H - 100, w: 140, h: 40 },
      { x: 820, y: H - 40, w: 160, h: 40 },
      { x: 1060, y: H - 140, w: 140, h: 40 },
      { x: 1280, y: H - 40, w: 220, h: 40 },
    ],
    spikes: [
      { x: 260, y: H - 20, w: 80, h: 20 },
      { x: 740, y: H - 20, w: 80, h: 20 },
    ],
    checkpoints: [
      { x: 620, y: H - 140, w: 20, h: 40 },
    ],
    goal: { x: 1440, y: H - 100, w: 40, h: 60 },
  });

  // Level 2 - vertical wall-jump shaft
  levels.push({
    name: 'Up the Shaft',
    height: 900,
    start: { x: 40, y: H - 120 },
    platforms: [
      { x: 0,   y: H - 40, w: 300, h: 40 },
      { x: 340, y: H - 40, w: 620, h: 40 },
      // wall-jump shaft: alternating left/right walls going up
      { x: 700, y: 780, w: 30, h: 220 },
      { x: 950, y: 700, w: 30, h: 300 },
      { x: 700, y: 560, w: 30, h: 220 },
      { x: 950, y: 380, w: 30, h: 220 },
      { x: 700, y: 200, w: 30, h: 220 },
      { x: 780, y: 140, w: 260, h: 30 },
    ],
    spikes: [],
    checkpoints: [
      { x: 350, y: H - 80, w: 20, h: 40 },
    ],
    goal: { x: 980, y: 90, w: 40, h: 50 },
  });

  // Level 3 - moving platforms over a chasm
  levels.push({
    name: 'Moving Ground',
    height: H,
    start: { x: 40, y: H - 120 },
    platforms: [
      { x: 0,   y: H - 40, w: 220, h: 40 },
      { x: 700, y: H - 40, w: 260, h: 40 },
      { x: 1200, y: H - 40, w: 220, h: 40 },
    ],
    movingPlatforms: [
      { x: 280, y: H - 90, w: 120, h: 24, axis: 'x', range: [280, 560], speed: 90, phase: 0 },
      { x: 980, y: H - 150, w: 110, h: 24, axis: 'y', range: [H - 190, H - 60], speed: 70, phase: 0 },
      { x: 1000, y: H - 260, w: 110, h: 24, axis: 'x', range: [1000, 1140], speed: 110, phase: 2 },
    ],
    spikes: [
      { x: 220, y: H - 20, w: 480, h: 20 },
      { x: 960, y: H - 20, w: 240, h: 20 },
    ],
    checkpoints: [
      { x: 710, y: H - 80, w: 20, h: 40 },
    ],
    goal: { x: 1360, y: H - 100, w: 40, h: 60 },
  });

  // Level 4 - spikes, gaps and wall jumps combined
  levels.push({
    name: 'Gauntlet',
    height: H,
    start: { x: 40, y: H - 120 },
    platforms: [
      { x: 0,   y: H - 40, w: 220, h: 40 },
      { x: 380, y: H - 40, w: 60,  h: 40 },
      { x: 520, y: H - 120, w: 60, h: 40 },
      { x: 660, y: H - 200, w: 60, h: 40 },
      { x: 520, y: H - 280, w: 60, h: 40 },
      { x: 660, y: H - 360, w: 60, h: 40 },
      { x: 800, y: H - 360, w: 240, h: 40 },
      { x: 1140, y: H - 300, w: 40, h: 260 },
      { x: 1300, y: H - 220, w: 40, h: 180 },
      { x: 1140, y: H - 140, w: 40, h: 100 },
      { x: 1400, y: H - 40, w: 260, h: 40 },
    ],
    spikes: [
      { x: 220, y: H - 20, w: 160, h: 20 },
      { x: 440, y: H - 20, w: 80, h: 20 },
    ],
    checkpoints: [
      { x: 810, y: H - 400, w: 20, h: 40 },
    ],
    goal: { x: 1560, y: H - 100, w: 40, h: 60 },
  });

  // Level 5 - final: everything combined, longer & tighter
  levels.push({
    name: 'Final Ascent',
    height: 1000,
    start: { x: 40, y: 860 },
    platforms: [
      { x: 0,   y: 900, w: 220, h: 40 },
      { x: 360, y: 900, w: 120, h: 40 },
      { x: 620, y: 840, w: 100, h: 40 },
      { x: 860, y: 780, w: 40, h: 220 },
      { x: 1000, y: 620, w: 40, h: 260 },
      { x: 860, y: 460, w: 40, h: 220 },
      { x: 940, y: 400, w: 220, h: 30 },
    ],
    movingPlatforms: [
      { x: 1240, y: 380, w: 110, h: 24, axis: 'y', range: [180, 380], speed: 85, phase: 1 },
      { x: 1420, y: 180, w: 130, h: 24, axis: 'x', range: [1420, 1600], speed: 100, phase: 0 },
    ],
    platformsTop: [
      { x: 1650, y: 130, w: 220, h: 40 },
    ],
    spikes: [
      { x: 220, y: 920, w: 140, h: 20 },
      { x: 480, y: 920, w: 140, h: 20 },
      { x: 720, y: 860, w: 140, h: 20 },
    ],
    checkpoints: [
      { x: 630, y: 800, w: 20, h: 40 },
      { x: 950, y: 360, w: 20, h: 40 },
    ],
    goal: { x: 1760, y: 70, w: 40, h: 60 },
  });
  // merge extra top platforms into main platform list for level 5
  levels[4].platforms = levels[4].platforms.concat(levels[4].platformsTop);
  delete levels[4].platformsTop;

  // compute level width from content
  for (const lvl of levels) {
    let maxX = lvl.goal.x + lvl.goal.w;
    for (const p of lvl.platforms) maxX = Math.max(maxX, p.x + p.w);
    if (lvl.movingPlatforms) for (const p of lvl.movingPlatforms) maxX = Math.max(maxX, p.range[1] + p.w, p.x + p.w);
    lvl.width = maxX + 160;
    if (!lvl.movingPlatforms) lvl.movingPlatforms = [];
    if (!lvl.spikes) lvl.spikes = [];
    if (!lvl.checkpoints) lvl.checkpoints = [];
  }
  return levels;
}

const LEVELS = buildLevels();

// ---------------------------------------------------------------
// Player
// ---------------------------------------------------------------
const PW = 26, PH = 38;
const GRAVITY = 0.62;
const MAX_FALL = 18;
const MOVE_ACCEL = 0.85;
const AIR_ACCEL = 0.55;
const MAX_SPEED = 5.4;
const GROUND_FRICTION = 0.78;
const AIR_FRICTION = 0.92;
const JUMP_VEL = -12.4;
const WALL_JUMP_VX = 7.6;
const WALL_JUMP_VY = -11.4;
const WALL_SLIDE_MAX = 2.6;
const COYOTE_TIME = 0.11;
const JUMP_BUFFER = 0.11;
const WALL_JUMP_LOCK = 0.14;

function makePlayer() {
  return {
    x: 0, y: 0, w: PW, h: PH,
    vx: 0, vy: 0,
    onGround: false,
    wallDir: 0, // -1 touching wall on left side of player (wall is to the left), 1 = wall to right
    facing: 1,
    coyote: 0,
    jumpBuffer: 0,
    wallLock: 0,
    dead: false,
    deadTimer: 0,
  };
}

const keys = {};
document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR') restartLevel();
  if (e.code === 'KeyN') skipLevel();
  if (['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)) {
    const idx = parseInt(e.code.slice(-1), 10) - 1;
    if (idx < LEVELS.length) goToLevel(idx);
  }
  if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp')) {
    if (game.state === 'complete' || game.state === 'victory') {
      advance();
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ---------------------------------------------------------------
// Game state
// ---------------------------------------------------------------
const game = {
  levelIndex: 0,
  state: 'playing', // playing | complete | victory
  timer: 0,
  deaths: 0,
  totalTime: 0,
  totalDeaths: 0,
  camX: 0,
  camY: 0,
};

let player = makePlayer();
let checkpointPos = null;

function currentLevel() { return LEVELS[game.levelIndex]; }

function resetCheckpointsVisual() {
  for (const cp of currentLevel().checkpoints) cp.active = false;
}

function spawnAt(pos) {
  player = makePlayer();
  player.x = pos.x;
  player.y = pos.y;
}

function startLevel(idx) {
  game.levelIndex = idx;
  game.state = 'playing';
  game.timer = 0;
  game.deaths = 0;
  checkpointPos = { x: currentLevel().start.x, y: currentLevel().start.y };
  resetCheckpointsVisual();
  spawnAt(checkpointPos);
}

function restartLevel() {
  if (game.state === 'victory') return;
  startLevel(game.levelIndex);
}

function goToLevel(idx) {
  startLevel(idx);
}

function skipLevel() {
  if (game.state === 'victory') return;
  advanceToNext();
}

function advance() {
  if (game.state === 'complete') advanceToNext();
  else if (game.state === 'victory') startLevel(0);
}

function advanceToNext() {
  if (game.levelIndex + 1 < LEVELS.length) {
    startLevel(game.levelIndex + 1);
  } else {
    game.state = 'victory';
  }
}

function die() {
  if (player.dead) return;
  player.dead = true;
  player.deadTimer = 0;
  game.deaths++;
}

// ---------------------------------------------------------------
// Update
// ---------------------------------------------------------------
function updateMovingPlatforms(lvl, dt, t) {
  for (const p of lvl.movingPlatforms) {
    const [min, max] = p.range;
    const mid = (min + max) / 2;
    const amp = (max - min) / 2;
    const val = mid + amp * Math.sin(t * (p.speed / 100) + p.phase);
    const prev = p.axis === 'x' ? (p.curX ?? p.x) : (p.curY ?? p.y);
    if (p.axis === 'x') { p.prevX = prev; p.curX = val; p.x = val; }
    else { p.prevY = prev; p.curY = val; p.y = val; }
  }
}

function collideAxis(entity, platforms, axis) {
  for (const p of platforms) {
    if (!rectsOverlap(entity, p)) continue;
    if (axis === 'x') {
      if (entity.vx > 0) { entity.x = p.x - entity.w; entity.wallHitRight = p; }
      else if (entity.vx < 0) { entity.x = p.x + p.w; entity.wallHitLeft = p; }
      entity.vx = 0;
    } else {
      if (entity.vy > 0) { entity.y = p.y - entity.h; entity.onGround = true; entity.standingOn = p; }
      else if (entity.vy < 0) { entity.y = p.y + p.h; }
      entity.vy = 0;
    }
  }
}

function update(dt) {
  const lvl = currentLevel();
  const t = performance.now() / 1000;
  updateMovingPlatforms(lvl, dt, t);
  const allSolids = lvl.platforms.concat(lvl.movingPlatforms);

  if (game.state !== 'playing') return;

  game.timer += dt;

  if (player.dead) {
    player.deadTimer += dt;
    if (player.deadTimer > 0.5) spawnAt(checkpointPos);
    return;
  }

  // horizontal input
  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];
  const jumpPressed = keys['Space'] || keys['KeyW'] || keys['ArrowUp'];

  if (jumpPressed) player.jumpBuffer = JUMP_BUFFER;
  else player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);

  const accel = (player.onGround ? MOVE_ACCEL : AIR_ACCEL) * dt;
  const wallLocked = player.wallLock > 0;
  player.wallLock = Math.max(0, player.wallLock - dt);

  if (!wallLocked) {
    if (left && !right) { player.vx -= accel; player.facing = -1; }
    else if (right && !left) { player.vx += accel; player.facing = 1; }
    else { player.vx *= Math.pow(player.onGround ? GROUND_FRICTION : AIR_FRICTION, dt); }
  }
  player.vx = clamp(player.vx, -MAX_SPEED, MAX_SPEED);

  // gravity
  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);

  // wall slide
  const touchingWall = player.wallDir !== 0;
  if (touchingWall && !player.onGround && player.vy > 0) {
    const pushingIntoWall = (player.wallDir === 1 && right) || (player.wallDir === -1 && left);
    if (pushingIntoWall) player.vy = Math.min(player.vy, WALL_SLIDE_MAX);
  }

  // coyote time
  if (player.onGround) player.coyote = COYOTE_TIME;
  else player.coyote = Math.max(0, player.coyote - dt);

  // jump / wall jump
  if (player.jumpBuffer > 0) {
    if (player.coyote > 0) {
      player.vy = JUMP_VEL;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
    } else if (touchingWall) {
      player.vy = WALL_JUMP_VY;
      player.vx = -player.wallDir * WALL_JUMP_VX;
      player.wallLock = WALL_JUMP_LOCK;
      player.facing = -player.wallDir;
      player.jumpBuffer = 0;
    }
  }

  // reset per-frame collision flags
  player.onGround = false;
  player.wallHitLeft = null;
  player.wallHitRight = null;

  // move and resolve collisions (X axis, then Y axis)
  doMove(player, allSolids, dt);

  // wall detection after move (small probe rects just outside player sides)
  const probeL = { x: player.x - 2, y: player.y + 4, w: 2, h: player.h - 8 };
  const probeR = { x: player.x + player.w, y: player.y + 4, w: 2, h: player.h - 8 };
  player.wallDir = 0;
  for (const p of allSolids) {
    if (rectsOverlap(probeL, p)) { player.wallDir = -1; break; }
  }
  if (player.wallDir === 0) {
    for (const p of allSolids) {
      if (rectsOverlap(probeR, p)) { player.wallDir = 1; break; }
    }
  }

  // carry player along moving platform they stand on
  if (player.standingOn && player.standingOn.axis) {
    const p = player.standingOn;
    if (p.axis === 'x' && p.prevX !== undefined) player.x += (p.curX - p.prevX);
    if (p.axis === 'y' && p.prevY !== undefined) player.y += (p.curY - p.prevY);
  }

  // hazards
  for (const s of lvl.spikes) {
    if (s.w > 0 && s.h > 0 && rectsOverlap(player, s)) { die(); break; }
  }

  // checkpoints
  for (const cp of lvl.checkpoints) {
    if (rectsOverlap(player, cp)) {
      cp.active = true;
      checkpointPos = { x: cp.x, y: cp.y - PH + cp.h };
    }
  }

  // fell off the world
  if (player.y > lvl.height + 200) die();

  // goal
  if (rectsOverlap(player, lvl.goal)) {
    game.state = 'complete';
    game.totalTime += game.timer;
    game.totalDeaths += game.deaths;
  }

  // camera
  const targetCamX = clamp(player.x + player.w / 2 - W / 2, 0, Math.max(0, lvl.width - W));
  const targetCamY = clamp(player.y + player.h / 2 - H / 2, 0, Math.max(0, lvl.height - H));
  game.camX += (targetCamX - game.camX) * Math.min(1, 12 * dt);
  game.camY += (targetCamY - game.camY) * Math.min(1, 12 * dt);
}

function doMove(p, solids, dt) {
  // X axis
  p.x += p.vx * dt;
  p.standingOn = null;
  collideAxis(p, solids, 'x');
  // Y axis
  p.y += p.vy * dt;
  collideAxis(p, solids, 'y');
}

// ---------------------------------------------------------------
// Draw
// ---------------------------------------------------------------
function drawSpike(s) {
  if (s.w <= 0) return;
  const count = Math.max(1, Math.round(s.w / 20));
  const step = s.w / count;
  ctx.fillStyle = '#e04b4b';
  for (let i = 0; i < count; i++) {
    ctx.beginPath();
    ctx.moveTo(s.x + i * step, s.y + s.h);
    ctx.lineTo(s.x + i * step + step / 2, s.y);
    ctx.lineTo(s.x + i * step + step, s.y + s.h);
    ctx.closePath();
    ctx.fill();
  }
}

function drawFrog(p) {
  const w = p.w, h = p.h;
  const cx = p.x + w / 2;
  const cy = p.y + h / 2;

  // hop squash/stretch: stretch tall on the way up, squash flat near landing
  const rise = clamp(-p.vy / 16, -0.3, 0.35);
  const onGroundSquash = p.onGround ? -0.12 : 0;
  const sx = 1 - rise * 0.35 - onGroundSquash * 0.6;
  const sy = 1 + rise * 0.35 + onGroundSquash;

  ctx.save();
  ctx.translate(cx, cy + h * 0.06);
  ctx.scale(sx, sy);

  // back legs, tucked at the sides
  ctx.fillStyle = '#2f7d3a';
  ctx.beginPath();
  ctx.ellipse(-w * 0.36, h * 0.28, w * 0.24, h * 0.18, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w * 0.36, h * 0.28, w * 0.24, h * 0.18, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.ellipse(0, h * 0.02, w * 0.54, h * 0.46, 0, 0, Math.PI * 2);
  ctx.fill();

  // belly
  ctx.fillStyle = '#d9edb6';
  ctx.beginPath();
  ctx.ellipse(0, h * 0.24, w * 0.32, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // eye bulges, shifted toward facing direction
  const eyeShift = p.facing * w * 0.14;
  const eyeY = -h * 0.36;
  ctx.fillStyle = '#eafbe0';
  ctx.beginPath();
  ctx.arc(eyeShift - w * 0.18, eyeY, w * 0.16, 0, Math.PI * 2);
  ctx.arc(eyeShift + w * 0.18, eyeY, w * 0.16, 0, Math.PI * 2);
  ctx.fill();

  // pupils, looking toward facing direction
  ctx.fillStyle = '#0a1408';
  const pupilShift = p.facing * w * 0.06;
  ctx.beginPath();
  ctx.arc(eyeShift - w * 0.18 + pupilShift, eyeY, w * 0.07, 0, Math.PI * 2);
  ctx.arc(eyeShift + w * 0.18 + pupilShift, eyeY, w * 0.07, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  const lvl = currentLevel();
  ctx.fillStyle = '#1a2030';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-game.camX, -game.camY);

  // parallax background dots
  ctx.fillStyle = '#232a3d';
  const parX = game.camX * 0.4;
  for (let i = -1; i < 20; i++) {
    ctx.fillRect(i * 140 - (parX % 140) + game.camX * 0.4, H - 200, 60, 200);
  }

  // platforms
  ctx.fillStyle = '#4c6ef5';
  for (const p of lvl.platforms) {
    ctx.fillStyle = '#5a6b8c';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#7c8db3';
    ctx.fillRect(p.x, p.y, p.w, 4);
  }

  // moving platforms
  for (const p of lvl.movingPlatforms) {
    ctx.fillStyle = '#c98a3a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#f0b25c';
    ctx.fillRect(p.x, p.y, p.w, 4);
  }

  // spikes
  for (const s of lvl.spikes) drawSpike(s);

  // checkpoints
  for (const cp of lvl.checkpoints) {
    ctx.fillStyle = cp.active ? '#43d17a' : '#666';
    ctx.fillRect(cp.x, cp.y, cp.w, cp.h);
    ctx.fillStyle = cp.active ? '#8fffb0' : '#999';
    ctx.beginPath();
    ctx.moveTo(cp.x + cp.w, cp.y);
    ctx.lineTo(cp.x + cp.w + 18, cp.y + 8);
    ctx.lineTo(cp.x + cp.w, cp.y + 16);
    ctx.closePath();
    ctx.fill();
  }

  // goal
  const g = lvl.goal;
  ctx.fillStyle = '#ffd93d';
  ctx.fillRect(g.x, g.y, 4, g.h);
  ctx.beginPath();
  ctx.moveTo(g.x + 4, g.y);
  ctx.lineTo(g.x + g.w, g.y + g.h * 0.25);
  ctx.lineTo(g.x + 4, g.y + g.h * 0.5);
  ctx.closePath();
  ctx.fill();

  // player
  if (!player.dead) drawFrog(player);

  ctx.restore();

  drawHUD(lvl);
}

function drawHUD(lvl) {
  ctx.fillStyle = '#eee';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`Level ${game.levelIndex + 1}/${LEVELS.length}: ${lvl.name}`, 12, 24);
  ctx.font = '14px Courier New';
  ctx.fillText(`Time: ${game.timer.toFixed(2)}s`, 12, 44);
  ctx.fillText(`Deaths: ${game.deaths}`, 12, 62);

  if (game.state === 'complete') {
    overlay();
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px Courier New';
    ctx.fillStyle = '#43d17a';
    ctx.fillText('Level Complete!', W / 2, H / 2 - 20);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#eee';
    ctx.fillText(`Time: ${game.timer.toFixed(2)}s   Deaths: ${game.deaths}`, W / 2, H / 2 + 12);
    ctx.fillText('Press SPACE to continue', W / 2, H / 2 + 40);
  } else if (game.state === 'victory') {
    overlay();
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px Courier New';
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('You beat Parkour!', W / 2, H / 2 - 30);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#eee';
    ctx.fillText(`Total time: ${game.totalTime.toFixed(2)}s   Total deaths: ${game.totalDeaths}`, W / 2, H / 2 + 6);
    ctx.fillText('Press SPACE to play again from Level 1', W / 2, H / 2 + 34);
  }
}

function overlay() {
  ctx.fillStyle = 'rgba(10, 14, 20, 0.72)';
  ctx.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------
let lastTime = null;
function loop(now) {
  if (lastTime === null) lastTime = now;
  let dt = (now - lastTime) / (1000 / 60); // dt=1 at 60fps
  dt = clamp(dt, 0, 2);
  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

startLevel(0);
requestAnimationFrame(loop);
</script>

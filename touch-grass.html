<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch Grass</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    canvas {
      border: 2px solid #fff;
      display: block;
    }
    #ui {
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }
    #message {
      margin-top: 6px;
      font-size: 18px;
      color: #fff;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="message"></div>
  <div id="ui">TAB — Look Busy &nbsp;|&nbsp; SPACE — Start / Restart</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');

    const W = canvas.width;
    const H = canvas.height;

    const FLOOR_Y = 420;
    const DESK = { x: 90, y: 330, w: 180, h: 16 };
    const MONITOR = { x: 130, y: 250, w: 100, h: 72 };
    const PLAYER = { x: 195, y: 330 };
    const DOOR = { x: W - 150, y: 110, w: 90, h: 270 };
    const CAUGHT_X = PLAYER.x + 55;

    const HIGH_SCORE_KEY = 'touchGrassHighScore';

    function loadHighScore() {
      try {
        return Number(localStorage.getItem(HIGH_SCORE_KEY) || 0);
      } catch (e) {
        return 0;
      }
    }

    function saveHighScore(value) {
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(Math.floor(value)));
      } catch (e) {
        // localStorage unavailable (e.g. opened via file:// in some browsers) — skip persistence
      }
    }

    const state = {
      screen: 'menu', // menu | playing | gameover
      score: 0,
      lives: 3,
      highScore: loadHighScore(),
      momPhase: 'hidden', // hidden | warning | approaching | caught | leaving
      phaseTimer: 0,
      momTimer: 0,
      reactionWindow: 1.6,
      difficulty: 0,
      flash: 0,
    };

    const mom = { x: DOOR.x + DOOR.w / 2 };

    function randRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function scheduleNextMom() {
      const gap = Math.max(1.8, 4.2 - state.difficulty * 0.12);
      state.momTimer = randRange(gap * 0.7, gap * 1.3);
    }

    function startGame() {
      state.screen = 'playing';
      state.score = 0;
      state.lives = 3;
      state.momPhase = 'hidden';
      state.difficulty = 0;
      state.reactionWindow = 1.6;
      state.flash = 0;
      scheduleNextMom();
      updateMessage();
    }

    function updateMessage() {
      if (state.screen === 'menu') {
        messageEl.textContent = 'Press SPACE to start grinding';
      } else if (state.screen === 'gameover') {
        messageEl.textContent =
          `Grounded! Screen Time: ${Math.floor(state.score)}s ` +
          `(High Score: ${Math.floor(state.highScore)}s). Press SPACE to restart.`;
      } else if (state.momPhase === 'warning') {
        messageEl.textContent = 'Footsteps in the hallway...';
      } else if (state.momPhase === 'approaching') {
        messageEl.textContent = 'MOM INCOMING! Press TAB to look busy!';
      } else if (state.momPhase === 'caught') {
        messageEl.textContent = 'Caught! "GO TOUCH GRASS!"';
      } else if (state.momPhase === 'leaving') {
        messageEl.textContent = 'Phew... close one.';
      } else {
        messageEl.textContent = '';
      }
    }

    function handleTab() {
      if (state.screen !== 'playing' || state.momPhase !== 'approaching') return;
      state.momPhase = 'leaving';
      state.phaseTimer = 0.8;
      state.difficulty++;
      state.reactionWindow = Math.max(0.85, 1.6 - state.difficulty * 0.05);
      state.score += 25;
      updateMessage();
    }

    function handleSpace() {
      if (state.screen === 'menu' || state.screen === 'gameover') startGame();
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Tab') {
        e.preventDefault();
        handleTab();
      } else if (e.code === 'Space') {
        e.preventDefault();
        handleSpace();
      }
    });

    function update(dt) {
      if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2);
      if (state.screen !== 'playing') return;

      if (state.momPhase === 'hidden') {
        state.score += dt * 10;
        state.momTimer -= dt;
        if (state.momTimer <= 0) {
          state.momPhase = 'warning';
          state.phaseTimer = 0.7;
          updateMessage();
        }
        return;
      }

      state.phaseTimer -= dt;

      if (state.momPhase === 'warning') {
        if (state.phaseTimer <= 0) {
          state.momPhase = 'approaching';
          state.phaseTimer = state.reactionWindow;
          mom.x = DOOR.x;
          updateMessage();
        }
      } else if (state.momPhase === 'approaching') {
        const progress = 1 - Math.max(0, state.phaseTimer) / state.reactionWindow;
        mom.x = DOOR.x + (CAUGHT_X - DOOR.x) * progress;
        if (state.phaseTimer <= 0) {
          state.momPhase = 'caught';
          state.phaseTimer = 1.1;
          state.lives--;
          state.flash = 1;
          mom.x = CAUGHT_X;
          updateMessage();
        }
      } else if (state.momPhase === 'caught') {
        if (state.phaseTimer <= 0) {
          if (state.lives <= 0) {
            state.screen = 'gameover';
            if (state.score > state.highScore) {
              state.highScore = state.score;
              saveHighScore(state.highScore);
            }
          } else {
            state.momPhase = 'hidden';
            scheduleNextMom();
          }
          updateMessage();
        }
      } else if (state.momPhase === 'leaving') {
        const progress = 1 - Math.max(0, state.phaseTimer) / 0.8;
        mom.x = CAUGHT_X - Math.min(1, progress * 1.3) * (CAUGHT_X - DOOR.x);
        if (state.phaseTimer <= 0) {
          state.momPhase = 'hidden';
          scheduleNextMom();
          updateMessage();
        }
      }
    }

    function drawRoom(now) {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, FLOOR_Y);
      ctx.fillStyle = '#1b140f';
      ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

      // Door frame
      ctx.strokeStyle = '#5a3d24';
      ctx.lineWidth = 6;
      ctx.strokeRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
      const doorOpen = state.momPhase !== 'hidden';
      if (!doorOpen) {
        ctx.fillStyle = '#6b4a2b';
        ctx.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
        ctx.fillStyle = '#2b1c10';
        ctx.beginPath();
        ctx.arc(DOOR.x + DOOR.w - 14, DOOR.y + DOOR.h / 2, 4, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#050505';
        ctx.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
      }

      // Desk
      ctx.fillStyle = '#7a4a24';
      ctx.fillRect(DESK.x, DESK.y, DESK.w, DESK.h);
      ctx.fillStyle = '#4d2e15';
      ctx.fillRect(DESK.x + 10, DESK.y + DESK.h, 10, FLOOR_Y - (DESK.y + DESK.h));
      ctx.fillRect(DESK.x + DESK.w - 20, DESK.y + DESK.h, 10, FLOOR_Y - (DESK.y + DESK.h));

      // Monitor
      ctx.fillStyle = '#222';
      ctx.fillRect(MONITOR.x, MONITOR.y, MONITOR.w, MONITOR.h);
      const glow = 0.4 + 0.3 * Math.abs(Math.sin(now / 220));
      ctx.fillStyle = `rgba(80, 220, 120, ${glow})`;
      ctx.fillRect(MONITOR.x + 6, MONITOR.y + 6, MONITOR.w - 12, MONITOR.h - 12);
      ctx.fillStyle = '#333';
      ctx.fillRect(MONITOR.x + MONITOR.w / 2 - 6, MONITOR.y + MONITOR.h, 12, 14);

      // Player
      ctx.fillStyle = '#e0b088';
      ctx.beginPath();
      ctx.arc(PLAYER.x, PLAYER.y - 20, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3355aa';
      ctx.fillRect(PLAYER.x - 14, PLAYER.y - 8, 28, 34);
    }

    function drawMom() {
      if (state.momPhase === 'hidden') return;

      if (state.momPhase === 'warning') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Courier New';
        ctx.textAlign = 'center';
        const bob = Math.sin(performance.now() / 100) * 4;
        ctx.fillText('!', DOOR.x + DOOR.w / 2, DOOR.y - 14 + bob);
        return;
      }

      const y = FLOOR_Y - 4;
      ctx.fillStyle = '#c23b6e';
      ctx.beginPath();
      ctx.moveTo(mom.x, y - 60);
      ctx.lineTo(mom.x - 18, y);
      ctx.lineTo(mom.x + 18, y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e0b088';
      ctx.beginPath();
      ctx.arc(mom.x, y - 72, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a2b2b';
      ctx.beginPath();
      ctx.arc(mom.x, y - 78, 14, Math.PI, Math.PI * 2);
      ctx.fill();

      if (state.momPhase === 'approaching') {
        const pct = Math.max(0, state.phaseTimer) / state.reactionWindow;
        const barW = 200;
        const barX = W / 2 - barW / 2;
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, 18, barW, 10);
        ctx.fillStyle = pct > 0.35 ? '#4caf50' : '#e05353';
        ctx.fillRect(barX, 18, barW * pct, 10);
      }
    }

    function drawHud() {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.font = '16px Courier New';
      ctx.fillText(`Screen Time: ${Math.floor(state.score)}s`, 14, 30);
      ctx.fillText(`High Score: ${Math.floor(state.highScore)}s`, 14, 50);

      for (let i = 0; i < 3; i++) {
        const bx = W - 30 - i * 26;
        const by = 26;
        ctx.fillStyle = i < state.lives ? '#4caf50' : '#333';
        ctx.beginPath();
        ctx.moveTo(bx, by - 14);
        ctx.lineTo(bx - 7, by + 6);
        ctx.lineTo(bx + 7, by + 6);
        ctx.closePath();
        ctx.fill();
      }

      if (state.flash > 0) {
        ctx.fillStyle = `rgba(200, 30, 30, ${state.flash * 0.35})`;
        ctx.fillRect(0, 0, W, H);
      }

      if (state.screen === 'menu' || state.screen === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px Courier New';
        ctx.fillText('TOUCH GRASS', W / 2, H / 2 - 10);
      }
    }

    function draw(now) {
      drawRoom(now);
      drawMom();
      drawHud();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw(now);
      requestAnimationFrame(loop);
    }

    updateMessage();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
